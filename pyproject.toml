[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "monitor-brightness-ubuntu"
version = "0.1.0"
description = "Per-monitor brightness control for Ubuntu (DDC/CI, laptop backlight, software dimming)"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
monitor-brightness = "monitor_brightness.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
